# This is a FK750M5-XBH6-SDRAM with a single STM32H750XBH6 chip.
# https://item.taobao.com/item.htm?id=682521953131
# QQ交流群：536665479
# Made by Peakors
# This is for using the STLINK

source [find interface/stlink.cfg]
# 从 OpenOCD 的接口目录加载 stlink.cfg，配置 ST-LINK 作为调试器接口的驱动和参数。

set CHIPNAME STM32H750XBH6
# 定义变量 CHIPNAME 为目标芯片型号 STM32H750XBH6，后续配置将引用该变量来定位 target。

set QUADSPI 1
# 定义变量 QUADSPI 为 1（启用），用于条件判断是否进行 Quad-SPI（外部闪存）相关初始化。

# enable stmqspi
# 接下来要启用或配置 Quad-SPI（片外闪存）相关功能

if {![info exists QUADSPI]} {
    set QUADSPI 1
}
# 如果变量 QUADSPI 未定义，则在此分支将其设置为 1，确保 QUADSPI 默认启用；使用 info exists 检查变量存在性。

source [find target/stm32h7x.cfg]
# 从 OpenOCD 的 target 目录加载 stm32h7x.cfg，包含 STM32H7 系列的通用 target 配置和寄存器定义。

reset_config srst_only
# 配置复位策略为仅使用外部系统复位（srst），不使用连接器或软件复位组合，影响调试器复位目标的方式。

# QUADSPI initialization
# 以下是 Quad-SPI（QSPI）外设初始化的自定义过程定义，配置引脚、时钟和 QSPI 控制寄存器。

proc qspi_init { qpi } {
    global a
    mmw 0x580244E0 0x000007FF 0;# RCC_AHB4ENR |= GPIOAEN-GPIOKEN (enable clocks)
    # 使用 mmw（memory modify write）对 RCC_AHB4ENR 寄存器写掩码，开启 GPIOA 到 GPIOK 的时钟使能位，为后续 GPIO 配置供电。

    mmw 0x580244D4 0x00004000 0;# RCC_AHB3ENR |= QSPIEN (enable clock)
    # 对 RCC_AHB3ENR 寄存器设置相应位以打开 QUADSPI 外设时钟，使能 QSPI 控制器。

    sleep 1;# Wait for clock startup
    # 延迟 1 毫秒以等待时钟稳定并确保外设可以被访问。

    # Port F: PF10:AF09:H, PF09:AF10:H, PF08:AF10:H, PF07:AF09:H, PF06:AF09:H
    # 用于 QSPI 的具体引脚和对应的复用功能（AF），便于查阅引脚复用表确认映射关系。

    mmw 0x58021400 0x002AA000 0x00155000    ;# MODER
    # 修改 GPIOF MODER 寄存器，配置 PF6-PF10 的模式（复用模式），通过掩码写入具体位以设置为 AF 模式。

    mmw 0x58021408 0x002AA000 0x00155000    ;# OSPEEDR
    # 配置 GPIOF OSPEEDR（输出速率）寄存器以设置高速度，满足 QSPI 高速时序要求。

    mmw 0x5802140C 0x00000000 0x003FF000    ;# PUPDR
    # 配置 GPIOF PUPDR（上拉/下拉）寄存器，这里写入具体拉电平配置以确保引脚上拉/下拉符合芯片与闪存需求。

    mmw 0x58021420 0x99000000 0x66000000    ;# AFRL
    # 配置 GPIOF AFRL/AFRH（复用功能选择），将低字节/高字节设置为对应 AF 值以选择 QSPI 功能。

    mmw 0x58021424 0x000009AA 0x00000655    ;# AFRH
    # 继续配置 GPIOF 高位的 AFR 寄存器，指定每个引脚的复用功能编号（AFx）。

    # Port G: PG06:AF10:H
    # 注明 GPIOG 的 PG6 用于 QSPI，并使用 AF10 复用功能。

    mmw 0x58021800 0x00002000 0x00001000    ;# MODER
    # 修改 GPIOG MODER 寄存器，将 PG6 设置为复用模式，为 QSPI CS/CLK/IO 引脚分配功能。

    mmw 0x58021808 0x00002000 0x00001000    ;# OSPEEDR
    # 配置 GPIOG 的输出速率为高速，以满足 QSPI 时钟和数据速率的要求。

    mmw 0x5802180C 0x00000000 0x00003000    ;# PUPDR
    # 配置 GPIOG 的上拉/下拉设置，确保 PG6 引脚在空闲时有确定的电平状态以防噪声。

    mmw 0x58021820 0x0A000000 0x05000000    ;# AFRL
    # 设置 GPIOG 的 AFR 寄存器，选择 PG6 的复用功能 AF10（或对应值）以使能 QSPI 映射。

    mww 0x52005000 0x01000F10               ;# QUADSPI_CR: PRESCALER = 0x1(2分频), FTHRES = 0b01111, FSEL=0, DFM=0, SSHIFT=1
    # 直接向 QUADSPI_CR（控制寄存器）写入值，设置时钟预分频、FIFO 水位阈值、数据采样位移等控制参数以优化性能。

    mww 0x52005004 0x00180001               ;# QUADSPI_DCR: FSIZE = 0b10110, CSHT = 0b000, CKMODE = 0b1
    # 写入 QUADSPI_DCR（设备配置寄存器），设置外部闪存大小（FSIZE）、片选保持时间、时钟模式（CKMODE）等必要参数。

    mmw 0x52005000 0x00000001 0             ;# QUADSPI_CR: EN=1
    # 修改 QUADSPI_CR 寄存器，将 EN（使能）位置 1，打开 QSPI 控制器以便后续命令操作可用。

    # 内存映射模式 单线SPI模式, 3字节地址
    # 后续配置将把 QSPI 设置为内存映射模式（外部闪存在 MCU 地址空间），使用单线 SPI 传输与 3 字节地址格式。

    mww 0x52005014 0x0D002503               ;# QUADSPI_CCR: FMODE=0x3, DMODE=0x1, DCYC=0x0, ADSIZE=0x2, ADMODE=0x1, IMODE=0x1, INSTR=READ
    # 写入 QUADSPI_CCR（指令/通信寄存器）以配置指令、地址和数据传输模式：这里设置为读指令、单线数据模式、24 位地址长度等以启用内存映射读。

}
# 结束 qspi_init 过程定义；此过程按需被调用以初始化 QSPI 并完成 GPIO 和寄存器配置。

$_CHIPNAME.cpu0 configure -event reset-init {
    global QUADSPI
    # 配置当目标 CPU0 在复位初始化事件（reset-init）发生时执行的脚本块；在此块内部可以执行寄存器初始化与外设配置。声明使用全局变量 QUADSPI。

    mmw 0x52002000 0x00000004 0x0000000B    ;# FLASH_ACR: 4 WS for 192 MHZ HCLK
    # 修改 FLASH_ACR（Flash 访问控制寄存器），设置等待状态（4 WS）以支持大约 192 MHz 的 HCLK 时钟频率，确保 Flash 访问时序正确。

    mmw 0x58024400 0x00000001 0x00000018    ;# RCC_CR: HSIDIV=1, HSI on
    # 配置 RCC_CR 寄存器以打开内部高速时钟 HSI 并设置分频（HSIDIV），提供后续 PLL 与系统时钟所需的参考时钟。

    mmw 0x58024410 0x10000000 0xEE000007    ;# RCC_CFGR: MCO2=system, MCO2PRE=8, HSI as system clock
    # 修改 RCC_CFGR 寄存器以暂时将系统时钟输出到 MCO2 并设置 MCO2 预分频器，且将 HSI 选为系统时钟来源用于早期引导配置。

    mww 0x58024418 0x00000040                ;# RCC_D1CFGR: D1CPRE=1, D1PPRE=2, HPRE=1
    # 写入 RCC_D1CFGR 寄存器以设置 D1 域时钟分频（D1CPRE、D1PPRE）和 AHB 总线预分频（HPRE），以保证各域时钟分配满足时序与功耗要求。

    mww 0x5802441C 0x00000440                ;# RCC_D2CFGR: D2PPRE2=2, D2PPRE1=2
    # 写入 RCC_D2CFGR，设置 D2 域的外设总线分频（D2PPRE1/D2PPRE2），影响 D2 域中外设（如 QSPI、DMA 等）的运行频率。

    mww 0x58024420 0x00000040                ;# RCC_D3CFGR: D3PPRE=2
    # 写入 RCC_D3CFGR，设置 D3 域的外设总线分频，确保 D3 域外设（如低速外设）时钟稳定。

    mww 0x58024428 0x00000040                ;# RCC_PPLCKSELR: DIVM3=0, DIVM2=0, DIVM1=4, PLLSRC=HSI
    # 写入 RCC_PLLCKSELR（选择 PLL 输入分频器），设置 DIVM1/2/3 等分频值并指定 PLL 源为 HSI，以准备 PLL1 的倍频参数。

    mmw 0x5802442C 0x0001000C 0x00000002    ;# RCC_PLLCFGR: PLL1RGE=8MHz to 16MHz, PLL1VCOSEL=wide
    # 修改 RCC_PLLCFGR，设置 PLL1 的输入范围和 VCO 选择（宽范围），以便后续设定得到期望的主频。

    mww 0x58024430 0x01070217                ;# RCC_PLL1DIVR: 192 MHz: DIVR1=2, DIVQ=8, DIVP1=2, DIVN1=24
    # 写入 RCC_PLL1DIVR，配置 PLL1 的倍频和分频系数（DIVN/DIVP/DIVQ/DIVR）以产生目标系统频率（示例为 192 MHz）。

    mmw 0x58024400 0x01000000 0                ;# RCC_CR: PLL1ON=1
    # 在 RCC_CR 中设置 PLL1ON 位以启动 PLL1，使能其 VCO 开始锁相并提供稳定的高频时钟输出。

    sleep 1
    # 延迟 1 毫秒以等待 PLL 锁定和系统时钟稳定，避免在 PLL 未就绪时切换系统时钟。

    mmw 0x58024410 0x00000003 0                ;# RCC_CFGR: PLL1 as system clock
    # 修改 RCC_CFGR，将系统时钟切换到 PLL1 输出（将 PLL1 设为系统时钟源），以达到配置的高频工作点。

    sleep 1
    # 再次延迟以确保系统时钟切换完成并稳定后再进行后续操作，如调试器速度调整或外设初始化。

    adapter speed 24000
    # 将 OpenOCD 与调试适配器的通信速度设置为 24000 kHz（24 MHz），提高传输速率以加速后续闪存操作或寄存器读写。

    if { $QUADSPI } {
        qspi_init 1
    }
    # 如果 QUADSPI 变量为真（1），则调用之前定义的 qspi_init 过程进行 QSPI 与 GPIO 的初始化，将外部闪存映射到地址空间。
}
# 结束 reset-init 事件处理块；在目标 CPU 复位初始化期间，上述寄存器与外设初始化将被执行以准备运行环境。